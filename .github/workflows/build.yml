name: Build App & Publish GitHub Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Required so GITHUB_TOKEN can create tags and publish GitHub Releases automatically
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Folder & Inject GPS/BLE Permissions
        working-directory: app
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create . --project-name bike_telemetry_app --org edu.asu.mct332s
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/main.dart.bak lib/main.dart
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/><uses-permission android:name="android.permission.BLUETOOTH"\/><uses-permission android:name="android.permission.BLUETOOTH_ADMIN"\/><uses-permission android:name="android.permission.BLUETOOTH_SCAN"\/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/><application/' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: app
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../self-driving-bike-v1.0.${{ github.run_number }}.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: self-driving-bike-android-apk
          path: self-driving-bike-v1.0.${{ github.run_number }}.apk

      - name: Create New GitHub Release Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Self-Driving Bike App v1.0.${{ github.run_number }}"
          body: |
            ### 🚲 Self-Driving Bike (MCT332s) — Automated Build v1.0.${{ github.run_number }}
            - **Android App (`.apk`):** Includes live phone GPS tracking, OpenStreetMap/OSRM place search & route navigation, Bluetooth BLE connection to ESP32, and live 5-sensor HUD (`Hall-Effect`, `Steering Potentiometer`, `Conditioned Strain Gauge`, `MPU6050 IMU`, `Wheel Speed Encoder`).
            - **ESP32 Firmware (`.ino`):** Included below for Arduino IDE upload.
          files: |
            self-driving-bike-v1.0.${{ github.run_number }}.apk
            esp/esp32_ble_sensors.ino
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
